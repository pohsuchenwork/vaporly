name: Deploy site

# Serves the landing page in site/ at https://pohsuchenwork.github.io/vaporly/
# once Pages is enabled on this repo with source "GitHub Actions".

on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  workflow_dispatch:

# No token permissions by default; each job below asks for only what it needs,
# so the job that checks out the repository never holds the Pages rights.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Read only: package site/ as the Pages artifact.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./site

  # Pages rights only, and no checkout: deploy the artifact the build job made.
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
